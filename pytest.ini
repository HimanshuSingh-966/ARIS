[pytest]
testpaths = tests
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
# The suite covers pure logic only: no network, no Supabase, no B2, and nothing
# that loads the FastEmbed model. Keep it that way so it stays runnable offline.
filterwarnings =
    ignore::DeprecationWarning
    # pypdf emits CryptographyDeprecationWarning (ARC4) on import, and
    # cryptography raises it as PendingDeprecationWarning on some versions, which
    # ignore::DeprecationWarning does not cover — the two are siblings, not
    # parent and child.
    ignore::PendingDeprecationWarning
